# End-to-end tests. cypress-io/github-action installs dependencies (with a
# frozen lockfile) and caches the Cypress binary itself, so this workflow has
# no install step of its own.

name: Cypress

on: [push]

permissions:
  contents: read

jobs:
  cypress:
    name: cypress
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Cypress run on chrome
        uses: cypress-io/github-action@v7
        with:
          start: yarn start
          browser: chrome
          config-file: cypress.config.ts

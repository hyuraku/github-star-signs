# Static checks (lint / typecheck / build) on every push, and a GitHub Pages
# deploy on master. Cypress e2e lives in its own workflow so the two run in
# parallel.

name: Node.js CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js from .node-version
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
      - name: prepare deploy
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: build
    # GitHub Pages allows only one in-progress deployment at a time.
    # Serialize deploys so back-to-back pushes (e.g. Dependabot merges) queue
    # instead of colliding with "due to in progress deployment" errors.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
